name: CI

# The test gate. Runs on every pull request, from any branch, and runs every
# unit and integration test. It deploys nothing.
#
# deploy.yml calls this same workflow again after a merge to develop or main,
# so the merged commit is tested before anything is deployed.
#
# Branch protection on develop and main should require exactly one check:
# "CI gate".

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Typecheck, build both servers and all web apps, then every vitest test:
  # unit, Postgres integration, row-level security, and the artifact tests that
  # start the real bundle, check it refuses an unprepared database, and check
  # that two clean builds are identical.
  verify:
    name: Typecheck, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ngo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ngo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/ngo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations may change schema, never write data (see the script for the allowed rows).
      - run: node .github/scripts/check-migrations.mjs
      - run: npm run ci

  # Known vulnerabilities in production dependencies, high severity and above.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci:audit

  # The one check branch protection requires. It fails unless every job above
  # passed, so adding a job later only means adding it to `needs` here.
  ci-gate:
    name: CI gate
    if: always()
    needs: [verify, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate job to have passed
        env:
          VERIFY: ${{ needs.verify.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          echo "verify: $VERIFY"
          echo "audit:  $AUDIT"
          test "$VERIFY" = success && test "$AUDIT" = success

version: 2

# Weekly update pull requests. Each one goes through the same "CI gate" as any
# other change, so nothing here deploys without the tests.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: ['*']

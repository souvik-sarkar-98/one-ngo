runtime: nodejs22
service: default
service_account: REPLACE_WITH_SERVICE_ACCOUNT
instance_class: F1
# bootstrap.js loads the secrets from Secret Manager, then starts dist/server.js.
entrypoint: node --enable-source-maps dist/bootstrap.js

automatic_scaling:
  min_instances: 0
  max_instances: 1
  max_concurrent_requests: 40

# Only non-secret settings belong here. Secret values are in the Secret Manager secret named by
# SECRET_CONFIG_ID, which the deploy writes from GitHub secrets.
env_variables:
  NODE_ENV: production
  PUBLIC_BASE_URL: REPLACE_WITH_PUBLIC_BASE_URL
  SECRET_CONFIG_ID: ngo-prod-config
  INSTALLATION_MODE: one-ngo
  DATABASE_POOL_SIZE: "3"
  BREACHED_PASSWORD_CHECK: online
  MEMORY_ALERT_MB: "300"

handlers:
  - url: /.*
    script: auto
    secure: always

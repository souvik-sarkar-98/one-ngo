runtime: nodejs22
service: console
service_account: REPLACE_WITH_CONSOLE_SERVICE_ACCOUNT
instance_class: F1
# bootstrap.js loads the secrets from Secret Manager, then starts dist/server.js.
entrypoint: node --enable-source-maps dist/bootstrap.js

automatic_scaling:
  min_instances: 0
  max_instances: 1
  max_concurrent_requests: 20

# Only non-secret settings belong here. Secret values are in the Secret Manager secret named by
# SECRET_CONFIG_ID, which the deploy writes from GitHub secrets.
env_variables:
  NODE_ENV: production
  OPERATOR_PUBLIC_BASE_URL: REPLACE_WITH_CONSOLE_PUBLIC_BASE_URL
  SECRET_CONFIG_ID: ngo-console-prod-config
  OPERATOR_OIDC_ISSUER: REPLACE_WITH_CONSOLE_OIDC_ISSUER
  OPERATOR_OIDC_CLIENT_ID: REPLACE_WITH_CONSOLE_OIDC_CLIENT_ID
  OPERATOR_OIDC_AUDIENCE: REPLACE_WITH_CONSOLE_OIDC_AUDIENCE
  OPERATOR_IAP_AUDIENCE: REPLACE_WITH_CONSOLE_IAP_AUDIENCE
  INSTALLATION_MODE: one-ngo

handlers:
  - url: /.*
    script: auto
    secure: always

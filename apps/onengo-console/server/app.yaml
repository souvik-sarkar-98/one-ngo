runtime: nodejs22
service: console
service_account: REPLACE_WITH_CONSOLE_SERVICE_ACCOUNT
instance_class: F1
entrypoint: node --enable-source-maps dist/server.js

automatic_scaling:
  min_instances: 0
  max_instances: 1
  max_concurrent_requests: 20

env_variables:
  NODE_ENV: production
  OPERATOR_PUBLIC_BASE_URL: REPLACE_WITH_CONSOLE_PUBLIC_BASE_URL
  OPERATOR_DATABASE_URL: REPLACE_WITH_CONSOLE_SYSTEM_DATABASE_SECRET
  OPERATOR_RUNTIME_URL: REPLACE_WITH_CONSOLE_RUNTIME_DATABASE_SECRET
  OPERATOR_ENCRYPTION_KEY: REPLACE_WITH_CONSOLE_ENCRYPTION_KEY
  ENCRYPTION_KEY: REPLACE_WITH_ENCRYPTION_KEY
  OPERATOR_INTERNAL_TOKEN_SECRET: REPLACE_WITH_CONSOLE_INTERNAL_TOKEN_SECRET
  OPERATOR_OIDC_ISSUER: REPLACE_WITH_CONSOLE_OIDC_ISSUER
  OPERATOR_OIDC_CLIENT_ID: REPLACE_WITH_CONSOLE_OIDC_CLIENT_ID
  OPERATOR_OIDC_CLIENT_SECRET: REPLACE_WITH_CONSOLE_OIDC_CLIENT_SECRET
  OPERATOR_OIDC_AUDIENCE: REPLACE_WITH_CONSOLE_OIDC_AUDIENCE
  OPERATOR_IAP_AUDIENCE: REPLACE_WITH_CONSOLE_IAP_AUDIENCE
  INSTALLATION_MODE: one-ngo

handlers:
  - url: /.*
    script: auto
    secure: always
